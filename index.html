<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二人讨论间 · M1 模拟版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f2f1f8;color:#222;height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;border:none;font-family:inherit}
input{font-family:inherit}
.hidden{display:none!important}

/* ---------- 顶部标题栏 ---------- */
#topbar{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:5}
#topbar .brand{font-weight:700;font-size:16px}
#topbar .sub{font-size:12px;opacity:.85;margin-top:2px}
#topMembers{font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px}

/* ---------- 大厅（进入） ---------- */
#lobby{flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef0ff,#fbeaff)}
.card{background:#fff;border-radius:16px;padding:28px 30px;box-shadow:0 10px 40px rgba(108,92,231,.15);width:360px}
.card h2{margin-bottom:6px}
.card .tip{color:#888;font-size:12px;margin-bottom:16px}
.lbl{font-size:13px;color:#555;margin:12px 0 4px}
.inp{width:100%;padding:10px 12px;border:1.5px solid #e3e0f5;border-radius:8px;font-size:14px}
.inp:focus{outline:none;border-color:#8b7cf0}
.btn{width:100%;padding:11px;border-radius:8px;font-size:15px;font-weight:600;background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff;margin-top:14px}
.btn.secondary{background:#eeeafc;color:#6c5ce7;margin-top:8px}
.hint{font-size:12px;color:#aaa;text-align:center;margin-top:12px;line-height:1.6}
#pwdShow{background:#f4f1ff;border:1.5px dashed #b8acf5;border-radius:8px;padding:10px;text-align:center;font-weight:700;color:#6c5ce7;margin-top:10px;font-size:15px}
.link{color:#6c5ce7;cursor:pointer;text-decoration:underline}

/* ---------- 讨论区 ---------- */
#room{flex:1;display:flex;flex-direction:column}
#stream{flex:1;overflow-y:auto;padding:16px 14px 8px;position:relative}
/* 弹幕浮层 */
#danmakuLayer{position:fixed;top:14%;left:0;width:100%;pointer-events:none;z-index:30;height:120px;overflow:hidden}
.danmaku{position:absolute;white-space:nowrap;font-size:16px;font-weight:600;color:#7c6cf0;text-shadow:0 1px 2px rgba(255,255,255,.9);animation:fly linear forwards}
@keyframes fly{from{transform:translateX(100vw)}to{transform:translateX(-110%)}}

/* 消息气泡 */
.msg{display:flex;margin-bottom:12px;animation:appear .25s ease}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.discuss .bubble{max-width:72%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;position:relative}
.msg .meta{font-size:11px;color:#b0aec8;margin:2px 4px;display:flex;align-items:center;gap:6px}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:linear-gradient(135deg,#6c5ce7,#8550e8);color:#fff;border-bottom-right-radius:4px}
.msg.peer .bubble{background:#fff;border:1px solid #eceaf7;border-bottom-left-radius:4px}
.msg.echo .bubble{background:#ffecf2;color:#c2346a;border-radius:12px}
.msg .appendTag{font-size:10px;background:rgba(0,0,0,.12);padding:1px 6px;border-radius:10px;margin-left:6px}
.msg .ts{opacity:.7}
.badge{font-size:10px;padding:1px 7px;border-radius:10px;background:#a855f7;color:#fff}

/* AI 总结卡 */
.summary-card{background:#f7f3ff;border:1.5px solid #ddcffc;border-left:4px solid #8b5cf6;border-radius:12px;padding:12px 14px;margin:6px 0 14px 8px;font-size:13px;max-width:88%}
.summary-card .head{display:flex;align-items:center;gap:8px;font-weight:700;color:#6d28d9;margin-bottom:6px}
.summary-card .field{color:#6d28d9;font-weight:600}
.summary-card .body{margin:4px 0;line-height:1.6;color:#3b2b5a}
.summary-card .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.summary-card .btns button{font-size:12px;padding:5px 10px;border-radius:8px}
.sumcard-btn{background:#e6dcff;color:#6d28d9}
.sb-redo{background:#ffd9df;color:#be2346}
.sb-fill{background:#fff0d6;color:#a06b00}
.summary-card .history{background:#fdfcff;border:1px dashed #d8c8f5;border-radius:8px;padding:8px;margin-top:8px;font-size:12px}
.summary-card .history .hov{margin:2px 0;color:#7c6cf0;cursor:pointer}

/* AI 阶段点评卡 */
.comment-card{border-radius:12px;padding:10px 13px;margin:4px 0 14px;font-size:13px;display:flex;align-items:flex-start;gap:8px;animation:appear .3s ease}
.comment-card.good{background:#e8f8ee;border:1.5px solid #bfe8cf;border-left:4px solid #22c55e}
.comment-card.off{background:#fff7e0;border:1.5px solid #f5e2a8;border-left:4px solid #eab308}
.comment-card .x{margin-left:auto;background:none;color:#999;font-size:14px;cursor:pointer}

/* 底部输入区 */
#inputBar{background:#fff;border-top:1px solid #eceaf7;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
#modeSwitch{display:flex;gap:6px}
.mode-chip{padding:5px 13px;border-radius:20px;font-size:13px;background:#f0eefb;color:#7c6cf0;border:1.5px solid transparent}
.mode-chip.on{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff}
#inputRow{display:flex;gap:8px}
#input{flex:1;padding:11px 13px;border:1.5px solid #e3e0f5;border-radius:10px;font-size:15px}
#input:focus{outline:none;border-color:#8b7cf0}
.act-btn{padding:0 16px;border-radius:10px;font-size:14px;font-weight:600;color:#fff}
#btnSend{background:#a855f7}
#btnSendSum{background:linear-gradient(135deg,#f59e0b,#ef4444);white-space:nowrap}
#btnDanmaku{background:#a855f7}
#btnEnd{background:#ef4444;color:#fff;padding:0 14px;border-radius:10px;font-weight:600}
#statusLine{font-size:12px;color:#b0aec8;display:flex;gap:14px;align-items:center}
#aiBusy{color:#8b5cf6;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- 结束确认弹层 ---------- */
#endOverlay{position:fixed;inset:0;background:rgba(20,10,40,.45);display:flex;align-items:center;justify-content:center;z-index:60}
#endBox{background:#fff;border-radius:16px;padding:26px 30px;width:380px;text-align:center}
#endBox h3{margin-bottom:8px}
#endState{font-size:13px;color:#555;margin:10px 0 4px}
.confirm-row{display:flex;gap:10px;margin-top:14px}

/* ---------- 复盘视图 ---------- */
#reviewView{flex:1;display:flex;flex-direction:column;background:#f6f5fb}
#reviewNav{display:flex;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #eceaf7}
.rnav-btn{padding:8px 18px;border-radius:24px;background:#f0eefb;color:#7c6cf0;font-weight:600;font-size:14px}
.rnav-btn.on{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff}
#playerPane{flex:1;overflow:hidden;display:flex;flex-direction:column}
#reviewStream{flex:1;overflow-y:auto;padding:16px 14px}
#playerBar{background:#241b45;padding:10px 14px 12px;color:#fff;flex-shrink:0}
#timeline{position:relative;height:34px;margin-bottom:4px}
#tlBar{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:4px;background:rgba(255,255,255,.18)}
#tlFill{position:absolute;left:0;top:14px;height:6px;border-radius:4px;background:linear-gradient(90deg,#a855f7,#6c5ce7);width:0}
#tlKnob{position:absolute;top:8px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #a855f7;transform:translateX(-50%);left:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tl-node{position:absolute;top:11px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid #fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tl-node.discuss{background:#38bdf8}
.tl-node.danmaku{background:#facc15}
.tl-node.comment-good{background:#22c55e}
.tl-node.comment-off{background:#eab308}
.tl-node.summary{background:#a855f7}
#pControls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbtn{background:rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
.pbtn:hover{background:rgba(255,255,255,.28)}
.speed{padding:5px 9px;border-radius:8px;background:none;color:#cfc6f5;font-size:13px}
.speed.on{background:#a855f7;color:#fff}
#filters{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fchip{padding:4px 11px;border-radius:16px;background:rgba(255,255,255,.13);color:#e5e0ff;font-size:12px}
.fchip.on{background:#fff;color:#6c5ce7;font-weight:600}
#tlTime{font-size:12px;color:#cfc6f5;margin-left:auto}
#timelineWrap{position:relative}

/* 评价复盘可视化 */
#evalPane{flex:1;overflow-y:auto;padding:18px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(108,92,231,.08)}
.kpi .v{font-size:24px;font-weight:800;color:#6c5ce7}
.kpi .k{font-size:12px;color:#999;margin-top:2px}
.panel{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(108,92,231,.06)}
.panel h4{margin-bottom:12px;color:#4c3a93;font-size:15px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo-col{background:#f7f6ff;border-radius:10px;padding:12px}
.duo-col.g{background:#eefaf2}
.duo-col .nm{font-weight:700;margin-bottom:6px}
.duo-col li{margin:4px 0 4px 16px;font-size:13px;line-height:1.5}
.tl-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed #eceaf7;font-size:13px}
.tl-item .t{color:#b0aec8;white-space:nowrap;min-width:52px}
.tl-item .tag{font-size:11px;padding:1px 7px;border-radius:8px;color:#fff;background:#c4b5fd;white-space:nowrap}
.verdict{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14px;line-height:1.7}
.act-btn-sm{margin-top:10px;padding:9px 16px;border-radius:10px;background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff;font-weight:600}

.banner{margin:6px 0 14px;font-size:12px;color:#8b7cf0;background:#f0edff;border-radius:8px;padding:8px 12px;line-height:1.6}
</style>
</head>
<body>

<!-- 顶部 -->
<div id="topbar">
  <div>
    <div class="brand">二人讨论间 · M1 模拟版</div>
    <div class="sub" id="topSub">等待进入</div>
  </div>
  <div id="topMembers"></div>
</div>

<!-- 大厅 -->
<div id="lobby">
  <div class="card">
    <h2>👋 进入讨论间</h2>
    <div class="tip">M1 单机模拟版 · 请在同一浏览器开两个标签页，分别作为「我」和「好友」</div>
    <div class="lbl">你的昵称</div>
    <input id="myName" class="inp" placeholder="例：小林">
    <div class="lbl">模式</div>
    <button class="btn" id="btnCreate">＋ 创建讨论间（我是发起人）</button>
    <button class="btn secondary" id="btnJoin">🔑 我有口令，加入好友的讨论间</button>
    <div id="joinBox" class="hidden">
      <div class="lbl">输入口令</div>
      <input id="pwdInput" class="inp" placeholder="6 位口令">
    </div>
    <div class="hint">创建方会自动生成一个口令；好友选「我有口令」输入即可。<br>两个标签页共用同一浏览器，数据会实时同步。</div>
  </div>
</div>

<!-- 讨论区 -->
<div id="room" class="hidden">
  <div id="danmakuLayer"></div>
  <div id="stream"></div>
  <div id="inputBar">
    <div id="modeSwitch">
      <button class="mode-chip on" data-mode="discuss">💬 讨论模式</button>
      <button class="mode-chip" data-mode="danmaku">🎤 弹幕模式</button>
      <div style="flex:1"></div>
      <button id="btnEnd">🛑 结束讨论</button>
    </div>
    <div id="inputRow">
      <input id="input" placeholder="输入你的观点…（Enter 发送）">
      <button class="act-btn hidden" id="btnDanmaku">发弹幕</button>
      <button class="act-btn" id="btnSend">发送</button>
      <button class="act-btn" id="btnSendSum">发送并总结 ✨</button>
    </div>
    <div id="statusLine">
      <span id="roomTopic">💬 讨论进行中</span>
      <span id="others"></span>
      <span id="aiBusy" class="hidden">🤖 AI 正在模拟总结…</span>
      <span style="flex:1"></span>
      <span id="pwdTip"></span>
    </div>
  </div>
</div>

<!-- 结束确认 -->
<div id="endOverlay" class="hidden">
  <div id="endBox">
    <h3>🛑 结束这场讨论？</h3>
    <div style="font-size:13px;color:#777;line-height:1.7">需<b>双方都确认</b>后才会生成复盘。<br>确认后将进入「对话式回放 + AI 评价」。</div>
    <div id="endState" class="hidden"></div>
    <div class="confirm-row">
      <button class="btn secondary" id="btnEndCancel" style="margin:0">取消</button>
      <button class="btn" id="btnEndConfirm" style="margin:0">确认结束</button>
    </div>
  </div>
</div>

<!-- 复盘视图 -->
<div id="reviewView" class="hidden">
  <div id="reviewNav">
    <button class="rnav-btn on" data-rv="playback">🎬 对话式回放</button>
    <button class="rnav-btn" data-rv="evaluate">🧭 AI 评价性复盘</button>
    <div style="flex:1"></div>
    <button class="btn secondary" id="btnExport" style="width:auto;margin:0;padding:7px 14px">📄 导出复盘网页</button>
  </div>
  <div id="playerPane">
    <div id="reviewStream"></div>
    <div id="playerBar">
      <div id="timelineWrap">
        <div id="timeline"></div>
      </div>
      <div id="pControls">
        <button class="pbtn" id="pPlay">▶</button>
        <button class="pbtn" id="pBack">⏮</button>
        <button class="pbtn" id="pFwd">⏭</button>
        <button class="pbtn" id="pRewind">◀◀</button>
        <button class="pbtn" id="pFast">▶▶</button>
        <span class="speed on" data-s="1">1x</span>
        <span class="speed" data-s="2">2x</span>
        <span class="speed" data-s="4">4x</span>
        <span id="tlTime">–:– / –:–</span>
      </div>
      <div id="filters">
        <span class="fchip on" data-f="all">全部</span>
        <span class="fchip" data-f="discuss">仅讨论</span>
        <span class="fchip" data-f="danmaku">仅弹幕</span>
        <span class="fchip" data-f="key">关键节点</span>
        <span class="fchip" data-f="comment">仅点评</span>
      </div>
    </div>
  </div>
  <div id="evalPane" class="hidden"></div>
</div>

<script>
"use strict";
/* ================= 模拟 AI 引擎 ================= */
const AI = {
  _pick(sentences){ return sentences.filter(s=>s.length>=6)||[]; },
  summarize(text){
    const clean = text.replace(/[，。！？、；：\n]+/g,'|').split('|').map(s=>s.trim()).filter(s=>s);
    let core = clean[0]||text.slice(0,20);
    let points = clean.slice(1,4);
    if(points.length===0) points = [text.length>20?text.slice(0,26)+'…':text];
    return {core, points};
  },
  comment(sumText){
    const t = sumText;
    if(/是不是|为什么|怎么办/.test(t)) return {style:'good', text:'🤔 这一段抛出了很关键的问题，值得深挖。'};
    if(/但是|其实|不过|我觉得|我认为/.test(t)) return {style:'good', text:'✨ 这一段在自我澄清，观点越来越清晰了！'};
    if(/啊|哈哈|算了|随便/.test(t)) return {style:'off', text:'🎈 这段似乎有点跑题，可以拉回主线。'};
    return {style:'good', text:'✨ 这一段表达得很清楚，双方思路有了新进展。'};
  }
};

/* ================= 全局状态 ================= */
const bc = new BroadcastChannel('discussion-room');
const S = {
  me:{name:'', isCreator:false, confirmed:false},
  peerConfirmed:false,
  inRoom:false,
  messages:[],   // {id,name,ts,content,appendTo,channel}
  summaries:[],  // {messageId, core, points, rev, versions:[]}
  comments:[],   // {id,msgId,atTs,style,text,source}
  danmakuActive:[],
  review:{currentTs:0,playing:false,spd:1,filter:'all',playingStart:0},
};

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>Date.now();

/* ================= 工具：本地+广播双写 ================= */
function broadcast(obj){ bc.postMessage(obj); }
function fmtTime(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }
function fmtTL(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }

/* ================= 进入 / 注册 ================= */
function enterRoom(name, isCreator){
  S.me.name = name; S.me.isCreator = isCreator; S.inRoom = true;
  $('#lobby').classList.add('hidden');
  $('#room').classList.remove('hidden');
  $('#topSub').textContent = '讨论进行中 · 你：'+name+(isCreator?'（发起人）':'');
  renderStatus();
  renderStream();
  broadcast({type:'hello', name, ts:now()});
}

$('#btnCreate').onclick=()=>{
  const name=$('#myName').value.trim(); if(!name){alert('请先输入昵称');return;}
  const pwd = String(Math.floor(100000+Math.random()*900000));
  localStorage.setItem('discuss_pwd', pwd);
  $('#pwdTip').textContent = '本窗口口令：'+pwd;
  enterRoom(name, true);
};
let joinStage=false;
$('#btnJoin').onclick=()=>{
  if(!joinStage){
    joinStage=true;
    $('#joinBox').classList.remove('hidden');
    $('#btnJoin').textContent='🔑 确认加入';
    return;
  }
  const name=$('#myName').value.trim(); if(!name){alert('请先输入昵称');return;}
  const pwd=$('#pwdInput').value.trim();
  const expect=localStorage.getItem('discuss_pwd');
  if(!expect){ alert('本浏览器还没有创建过讨论间，请先在另一个标签页点「创建讨论间」。'); return; }
  if(!pwd||pwd!==expect){ alert('口令不正确'); return; }
  enterRoom(name,false);
};

/* ================= 消息渲染 ================= */
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function trackPeers(){
  const names=new Set();
  S.messages.forEach(m=>{ if(m.name && m.name!==S.me.name) names.add(m.name); });
  S.peerName=[...names][0]||'好友';
}
function renderStatus(){
  trackPeers();
  const names = new Set([S.me.name]);
  S.messages.forEach(m=>names.add(m.name));
  names.delete(S.me.name);
  if(names.size) $('#others').textContent = '在线：'+(S.me.name)+' + '+ [...names].join('、');
  else $('#others').textContent = '等待好友加入…（另开一个标签页输入口令加入）';
}
function renderStream(){
  const el=$('#stream'); el.innerHTML='';
  let lastAppendGroup=null;
  S.messages.slice().sort((a,b)=>a.ts-b.ts).forEach(m=>{
    if(m.channel==='danmaku') return; // 弹幕用浮层展示
    const isMe = m.name===S.me.name;
    const d=document.createElement('div');
    d.className='msg discuss '+(isMe?'me':'peer');
    d.dataset.ts=m.ts;
    const appendTag = m.appendTo ? '<span class="appendTag">· 补充</span>' : '';
    const meta = '<div class="meta">'+(isMe?'':'')+(m.name||'')+' <span class="ts">'+fmtTime(m.ts)+'</span>'+appendTag+'</div>';
    d.innerHTML = meta + '<div class="bubble">'+esc(m.content)+'</div>';
    el.appendChild(d);
    // 若该消息有 summary，紧跟渲染
    const sm = S.summaries.find(x=>x.messageId===m.id);
    if(sm) el.appendChild(renderSummaryCard(sm, m));
    // AI 阶段点评卡：穿插在「发送并总结」之后
    const cm = S.comments.find(c=>c.msgId===m.id);
    if(cm) el.appendChild(renderComment(cm));
  });
  // 弹幕浮层重现（无动画，直接提示）
  const dmsg = S.messages.filter(m=>m.channel==='danmaku');
  if(dmsg.length){
    const b=document.createElement('div');
    b.className='banner';

function renderComment(cm){

function sendDiscuss(content, withSummary){

  const m={id,name:S.me.name,ts,content,channel:'discuss',appendTo:null};
  S.messages.push(m);
  renderStream();
  broadcast({type:'msg',m});

}
function sendDanmaku(content){
  const m={id:uid(),name:S.me.name,ts:now(),content,channel:'danmaku'};
  S.messages.push(m);
  renderStream();
  broadcast({type:'msg',m});
  spawnDanmaku(m.content);
}
function spawnDanmaku(text){
  const layer=$('#danmakuLayer');
  const d=document.createElement('div');
  d.className='danmaku'; d.textContent='🎤 '+S.me.name+'：'+text;
  d.style.top=(Math.random()*70)+'px';
  d.style.animationDuration=(4+Math.random()*2)+'s';
  layer.appendChild(d);
  setTimeout(()=>d.remove(), 7000);
}
function genSummary(msg){
  $('#aiBusy').classList.remove('hidden');
  setTimeout(()=>{
    $('#aiBusy').classList.add('hidden');
    const res=AI.summarize(msg.content);
    const sm={messageId:msg.id, core:res.core, points:res.points, rev:0, versions:[{core:res.core, points:res.points}]};
    S.summaries.push(sm);
    renderStream();
    broadcast({type:'summary',sm});
  }, 600+Math.random()*500);
}
function redoSummary(msgId){
  const msg=S.messages.find(m=>m.id===msgId);
  const sm=S.summaries.find(x=>x.messageId===msgId); if(!sm||!msg) return;
  // 合并该段原文+所有补充
  const full = S.messages.filter(m=>m.appendTo===msgId).map(m=>m.content);
  const text = msg.content + (full.length?'（补充：'+full.join('；')+'）':'');
  const res=AI.summarize(text);
  sm.rev=sm.versions.length;
  sm.versions.push({core:res.core+'（已修订）', points:res.points});
  renderStream();
  broadcast({type:'summary',sm});
}
function startFill(msgId){
  const next=S.messages.find(m=>m.id===msgId); if(!next) return;
  $('#input').focus();
  $('#input').dataset.fill=msgId;
  $('#input').placeholder='补充第「'+next.name+'」段的说明，然后回车（将作为"· 补充"）';
}

}

/* ================= 复盘：对话式回放 ================= */
let rvTab='playback';
// 复盘回放：当前筛选节点列表 + 时间轴边界 + 拖拽状态
const R={nodes:[],min:0,max:0};
let dragging=false;
$('#btnExport').onclick=exportReview;

function enterReview(){
  S.inRoom=false;

  $('#reviewView').classList.remove('hidden');

/* 复盘阶段：为每一段（有总结的消息）生成一条 AI 点评 */
function ensureComments(){
  if(S.comments.length) return;
  S.summaries.forEach(sm=>{
    const m=S.messages.find(x=>x.id===sm.messageId); if(!m) return;
    const v=sm.versions[sm.rev]||sm.versions[sm.versions.length-1];
    const cm=AI.comment((v&&v.core)||m.content);
    S.comments.push({id:uid(),msgId:sm.messageId,atTs:m.ts,style:cm.style,text:cm.text,source:'auto'});
  });
}
document.querySelectorAll('.rnav-btn').forEach(b=>b.onclick=()=>{
  rvTab=b.dataset.rv;
  document.querySelectorAll('.rnav-btn').forEach(x=>x.classList.toggle('on',x===b));
  $('#playerPane').classList.toggle('hidden', rvTab!=='playback');
  $('#evalPane').classList.toggle('hidden', rvTab!=='evaluate');
});

function allNodes(){
  const nodes=[];
  S.messages.slice().sort((a,b)=>a.ts-b.ts).forEach(m=>{
    if(m.channel==='danmaku') nodes.push({ts:m.ts,kind:'danmaku',content:m.name+'：'+m.content});
    else nodes.push({ts:m.ts,kind:'discuss',content:m.content,msg:m});
    if(S.summaries.find(x=>x.messageId===m.id)) nodes.push({ts:m.ts,kind:'summary',content:'AI 总结'});
  });
  S.comments.forEach(c=>nodes.push({ts:c.atTs,kind:c.style==='good'?'comment-good':'comment-off',content:c.text}));
  return nodes.sort((a,b)=>a.ts-b.ts);
}
function buildTimeline(){
  const nodes=allNodes();
  if(!nodes.length) return;
  const min=nodes[0].ts, max=nodes[nodes.length-1].ts;
  R.min=min; R.max=max;
  const tl=$('#timeline'); tl.innerHTML='';
  const bar=document.createElement('div'); bar.id='tlBar'; tl.appendChild(bar);
  const fill=document.createElement('div'); fill.id='tlFill'; tl.appendChild(fill);
  const knob=document.createElement('div'); knob.id='tlKnob'; tl.appendChild(knob);
  nodes.forEach(n=>{
    const pct=((n.ts-min)/(max-min||1))*100;
    const d=document.createElement('div');
    d.className='tl-node '+n.kind; d.style.left=pct+'%';
    d.title=n.content.slice(0,30);
    d.onclick=()=>{ S.review.currentTs=n.ts; syncPlayback(); };
    tl.appendChild(d);
  });
  // 拖动进度条（视频式：消息随进度出现/消失）
  tl.style.cursor='pointer';
  tl.addEventListener('pointerdown',e=>{ dragging=true; if(tl.setPointerCapture) try{tl.setPointerCapture(e.pointerId);}catch(_){ } scrubTL(e.clientX); });
  tl.addEventListener('pointermove',e=>{ if(dragging) scrubTL(e.clientX); });
  tl.addEventListener('pointerup',()=>{ dragging=false; });
  tl.addEventListener('pointercancel',()=>{ dragging=false; });
}
function scrubTL(cx){
  const r=$('#timeline').getBoundingClientRect();
  const p=(cx-r.left)/r.width;
  S.review.currentTs=R.min+(R.max-R.min)*Math.min(Math.max(p,0),1);
  syncPlayback();
}
const kindRank={danmaku:0,discuss:0,summary:1,comment:2};
/* 回放节点列表（按当前筛选） */
function buildPlayNodes(filter){
  const list=[];
  S.messages.slice().sort((a,b)=>a.ts-b.ts).forEach(m=>{
    const hasSum=!!S.summaries.find(x=>x.messageId===m.id);
    const com=S.comments.find(c=>c.msgId===m.id);
    if(m.channel==='danmaku'){
      if(filter==='all'||filter==='danmaku') list.push({ts:m.ts,kind:'danmaku',msg:m});
    }else{
      if(filter==='all'||filter==='discuss') list.push({ts:m.ts,kind:'discuss',msg:m});
      if(hasSum && (filter==='all'||filter==='key')) list.push({ts:m.ts,kind:'summary',msg:m});
      if(com && (filter==='all'||filter==='key'||filter==='comment')) list.push({ts:m.ts,kind:'comment',msg:m,comment:com});
    }
  });
  list.sort((a,b)=>(a.ts-b.ts)||(kindRank[a.kind]-kindRank[b.kind]));
  return list;
}
/* 单个回放节点 DOM */
function makeNodeEl(n){
  const d=document.createElement('div');
  if(n.kind==='danmaku'){
    const m=n.msg;
    d.className='msg echo'; d.dataset.ts=m.ts;
    d.innerHTML='<div class="bubble">🎤 '+esc(m.name)+'：'+esc(m.content)+'</div>';
  }else if(n.kind==='discuss'){
    const m=n.msg;
    d.className='msg discuss '+(m.name===S.me.name?'me':'peer'); d.dataset.ts=m.ts;
    const app=m.appendTo?'<span class="appendTag">· 补充</span>':'';
    d.innerHTML='<div class="meta">'+esc(m.name)+' <span class="ts">'+fmtTime(m.ts)+'</span>'+app+'</div><div class="bubble">'+esc(m.content)+'</div>';
  }else if(n.kind==='summary'){
    const sm=S.summaries.find(x=>x.messageId===n.msg.id);
    const v=sm.versions[sm.rev]||sm.versions[sm.versions.length-1];
    d.className='summary-card'; d.dataset.ts=n.ts;
    d.innerHTML='<div class="head">🤖 AI 总结 · '+esc(n.msg.name)+'<span class="badge">v'+(sm.rev+1)+'</span></div>'+
      '<div class="body"><span class="field">【核心观点】</span>'+esc(v.core)+'</div>'+
      (v.points?'<div class="body"><span class="field">【论据 / 细节】</span>'+v.points.map(p=>'<br>· '+esc(p)).join('')+'</div>':'');
  }else if(n.kind==='comment'){
    const c=n.comment;
    d.className='comment-card '+(c.style==='good'?'good':'off'); d.dataset.ts=n.ts;
    d.innerHTML='<span>'+(c.style==='good'?'✅':'🟡')+'</span><span>'+esc(c.text)+'</span>'+
      '<span style="font-size:11px;opacity:.6;margin-left:6px">· 复盘点评</span>';
  }
  return d;
}
/* 渲染到前 count 个节点：增量追加，形成视频式出现/消失 */
function renderPlaybackTo(count){
  const stream=$('#reviewStream');
  const cur=stream.children.length;
  if(count < cur || cur===0){
    stream.innerHTML='';
    for(let i=0;i<count;i++) stream.appendChild(makeNodeEl(R.nodes[i]));
  }else{
    for(let i=cur;i<count;i++) stream.appendChild(makeNodeEl(R.nodes[i]));
  }
  if(count===0){ stream.scrollTop=0; return; }
  const last=stream.children[stream.children.length-1];
  if(last) last.scrollIntoView({block:'center',behavior:'auto'});
}
function renderPlayback(){
  R.nodes=buildPlayNodes(S.review.filter);
  $('#reviewStream').innerHTML='';
  S.review.currentTs = R.nodes.length? R.nodes[R.nodes.length-1].ts : (R.min||0);
  syncPlayback();
}
function syncPlayback(){
  const pct=((S.review.currentTs-R.min)/(R.max-R.min||1))*100;
  $('#tlFill').style.width=pct+'%';
  $('#tlKnob').style.left=pct+'%';
  $('#tlTime').textContent=fmtTL(S.review.currentTs)+' / '+fmtTL(R.max);
  // 计算当前应显示的节点数（ts 不超过当前进度）
  let vis=0;
  for(let i=0;i<R.nodes.length;i++){ if(R.nodes[i].ts<=S.review.currentTs) vis=i+1; else break; }
  renderPlaybackTo(vis);
}
/* 播放控制 */
$('#pPlay').onclick=()=>{
  S.review.playing=!S.review.playing;
  $('#pPlay').textContent=S.review.playing?'⏸':'▶';
  if(S.review.playing){ S.review.playingStart=now(); S.review.lastTs=S.review.currentTs; tick(); }
};
function tick(){
  if(!S.review.playing) return;
  if(!R.nodes.length) return;
  const dt=(now()-S.review.playingStart)*S.review.spd;
  S.review.currentTs=Math.min(S.review.lastTs+dt, R.max);
  syncPlayback();
  if(S.review.currentTs>=R.max){ S.review.playing=false; $('#pPlay').textContent='▶'; }
  requestAnimationFrame(tick);
}
document.querySelectorAll('.speed').forEach(s=>s.onclick=()=>{

$('#pFwd').onclick=()=>{ const n=allNodes(); S.review.currentTs=n.length?n[n.length-1].ts:0; syncPlayback(); };
$('#pRewind').onclick=()=>{ const n=allNodes(); const i=n.findIndex(x=>x.ts>=S.review.currentTs); S.review.currentTs=i>0?n[Math.max(0,i-3)].ts:S.review.currentTs; syncPlayback(); };

        (sm?('<div class="s">🤖 总结：'+esc((sm.versions[sm.rev]||sm.versions[0]).core)+'</div>'):'');
    }).join('')+
    '<hr style="margin:20px 0"><p style="color:#888;font-size:12px">本页由「二人讨论间」自动生成 · 内容由 AI 整理，仅供参考</p></body></html>';
  const w=window.open(); w.document.write(html); w.document.close();
}

/* ================= BroadcastChannel 接收 ================= */
bc.onmessage=(e)=>{
  const d=e.data; if(!d) return;
  switch(d.type){
    case 'hello':
      if(!S.messages.some(x=>x.name===d.name)) { /* 提示在线 */ }
      renderStatus();
      break;
    case 'msg':
      if(!S.messages.find(x=>x.id===d.m.id)){ S.messages.push(d.m); renderStatus(); renderStream(); }
      break;
    case 'summary':
      if(!S.summaries.find(x=>x.messageId===d.sm.messageId)){ S.summaries.push(d.sm); renderStream(); }
      break;
    case 'comment':
      if(!S.comments.find(x=>x.id===d.cm.id)){ S.comments.push(d.cm); renderStream(); }
      break;
    case 'rmcomment':
      S.comments=S.comments.filter(c=>c.id!==d.id); renderStream();
      break;
    case 'endRequest':
      askEnd(); break;
    case 'endConfirm':
      S.peerConfirmed=true; renderEndState(); checkEnd(); break;
    case 'endApproved':
      if(!document.querySelector('#reviewView').classList.contains('hidden')) break;
      enterReview(); break;
  }
};


// 初始化（若此前已在 localStorage 有口令则提示）
</script>
